services:
  - type: web
    name: mint-private-ai
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      # Requests per minute per visitor for /api/chat (default 15).
      # This is the only spending control, so keep it set.
      - key: MINT_RATE_LIMIT
        value: "15"
      - key: NODE_VERSION
        value: "22"

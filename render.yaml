services:
  - type: web
    name: mint-private-ai
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      # OpenRouter key for Gemma 4 31B and MiniMax M3.1 Flash.
      - key: OPEN_CODE_KEY
        sync: false
      # Messages per minute per device for /api/chat (default 15).
      # This is the only spending control, so keep it set.
      - key: MINT_RATE_LIMIT
        value: "15"
      # Signs the device cookie, and the 24-hour bans written into it. Keep it
      # fixed: if it changes, every device gets a new identity and bans are forgotten.
      - key: MINT_DEVICE_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22"

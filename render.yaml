services:
  - type: web
    name: mint-private-ai
    runtime: node
    plan: free
    # pip install is best-effort: if the image lacks pip or matplotlib, the
    # app still builds and /api/plot answers 503 until they are available.
    buildCommand: npm ci --include=dev && (pip install -r requirements.txt || true) && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      # Requests per minute per visitor for /api/chat (default 15).
      # This is the only spending control, so keep it set.
      - key: MINT_RATE_LIMIT
        value: "15"
      - key: NODE_VERSION
        value: "22"
